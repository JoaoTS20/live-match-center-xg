name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older in-progress runs when you push a new commit to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Java / Spring Boot Unit Tests
  # ---------------------------------------------------------------------------
  test-match-service:
    name: Test match-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: match-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: match-service/pom.xml

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  # ---------------------------------------------------------------------------
  # 2. Python / FastAPI Unit Tests
  # ---------------------------------------------------------------------------
  test-narrator-worker:
    name: Test narrator-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narrator-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: narrator-worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: python -m pytest -v

  # ---------------------------------------------------------------------------
  # 3. Angular TypeScript & Production Build Check
  # ---------------------------------------------------------------------------
  build-frontend-ui:
    name: Build frontend-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies & verify production build
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # 4. Kubernetes Manifest Schema Validation (Offline, Zero Cluster Needed)
  # ---------------------------------------------------------------------------
  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate k8s/ YAML schemas
        run: kubeconform -strict -summary k8s/

  # ---------------------------------------------------------------------------
  # 5. Docker Build Gate (PRs) & Publish to GHCR (main only)
  # ---------------------------------------------------------------------------
  docker-build-and-publish:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - test-match-service
      - test-narrator-worker
      - build-frontend-ui
      - validate-k8s
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [match-service, narrator-worker, frontend-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags & metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
