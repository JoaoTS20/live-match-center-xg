spring.application.name=match-service

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/matchdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:matchuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:matchpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Apache Kafka Producer (sends match event)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Apache Kafka Consumer (unique group per instance so every SSE replica receives all commentary)
spring.kafka.consumer.group-id=match-service-sse-${HOSTNAME:local}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Redis Cache
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.cache.type=redis

# Custom App Properties
app.kafka.topics.match-events=match-events
app.kafka.topics.match-commentary=match-commentary

# Spring Boot Actuator (Kubernetes Probes + Cache Inspection)
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Keep Redis outages from taking match-service DOWN (CacheErrorHandler falls back to PostgreSQL)
management.health.redis.enabled=false
