spring.application.name=match-service

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/matchdb
spring.datasource.username=matchuser
spring.datasource.password=matchpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Custom App Properties
app.kafka.topics.match-events=match-events

# Spring Boot Actuator (Kubernetes Probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

