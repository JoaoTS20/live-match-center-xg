name: live-match-center-xg

services:
  postgres:
    image: postgres:16-alpine
    container_name: match-postgres
    ports: 
      - "5432:5432"
    environment: 
      POSTGRES_DB: matchdb 
      POSTGRES_USER: matchuser 
      POSTGRES_PASSWORD: matchpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:3.8.0
    container_name: match-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  match-service:
    build:
      context: ./match-service
      dockerfile: Dockerfile
    container_name: match-service
    ports:
      - "8080:8080"
    environment:
      # Override localhost -> Docker network service names
      SPRING_DATASOURCE_URL: jdbc:postgresql://match-postgres:5432/matchdb
      SPRING_DATASOURCE_USERNAME: matchuser
      SPRING_DATASOURCE_PASSWORD: matchpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: match-kafka:29092
    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data: