name: live-match-center-xg

services:
  postgres:
    image: postgres:16-alpine
    container_name: match-postgres
    ports: 
      - "5432:5432"
    environment: 
      POSTGRES_DB: matchdb 
      POSTGRES_USER: matchuser 
      POSTGRES_PASSWORD: matchpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchuser -d matchdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  kafka:
    image: apache/kafka:3.8.0
    container_name: match-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
  match-service:
    build:
      context: ./match-service
      dockerfile: Dockerfile
    container_name: match-service
    ports:
      - "8080:8080"
    environment:
      # Override localhost -> Docker network service names
      SPRING_DATASOURCE_URL: jdbc:postgresql://match-postgres:5432/matchdb
      SPRING_DATASOURCE_USERNAME: matchuser
      SPRING_DATASOURCE_PASSWORD: matchpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  narrator-worker:
    build:
      context: ./narrator-worker
      dockerfile: Dockerfile
    container_name: narrator-worker
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: match-events
      KAFKA_COMMENTARY_TOPIC: match-commentary
      KAFKA_GROUP_ID: narrator-worker-group
      MATCH_SERVICE_URL: http://match-service:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      match-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  frontend-ui:
    build:
      context: ./frontend-ui
      dockerfile: Dockerfile
    container_name: match-frontend
    ports:
      - "4200:8080"
    depends_on:
      match-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data: