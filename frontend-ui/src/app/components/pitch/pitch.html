<p class="hint">
  Click anywhere on the pitch to place the event:
  <strong>({{ coordinates().x }}, {{ coordinates().y }})</strong>
</p>

<svg
  class="pitch"
  viewBox="0 0 100 68"
  (click)="onPitchClick($event)"
>
  <!-- Grass & outer touchlines -->
  <rect x="0" y="0" width="100" height="68" fill="#1e7e34" />
  <rect x="2" y="2" width="96" height="64" fill="none" stroke="#fff" stroke-width="0.6" />

  <!-- Halfway line & center circle -->
  <line x1="50" y1="2" x2="50" y2="66" stroke="#fff" stroke-width="0.6" />
  <circle cx="50" cy="34" r="9" fill="none" stroke="#fff" stroke-width="0.6" />
  <circle cx="50" cy="34" r="0.8" fill="#fff" />

  <!-- Left penalty box & 6-yard box -->
  <rect x="2" y="14" width="16" height="40" fill="none" stroke="#fff" stroke-width="0.6" />
  <rect x="2" y="24" width="6" height="20" fill="none" stroke="#fff" stroke-width="0.6" />

  <!-- Right penalty box & 6-yard box (attacking goal) -->
  <rect x="82" y="14" width="16" height="40" fill="none" stroke="#fff" stroke-width="0.6" />
  <rect x="92" y="24" width="6" height="20" fill="none" stroke="#fff" stroke-width="0.6" />

  <!-- Selected event marker (y is scaled from 0..100 to the 0..68 SVG height) -->
  <circle
    [attr.cx]="coordinates().x"
    [attr.cy]="(coordinates().y / 100) * 68"
    r="2"
    fill="#ffcc00"
    stroke="#111"
    stroke-width="0.5"
  />
</svg>
