<main class="container">
  <h1>Live Match Center</h1>

  <app-event-controls
    [coordinates]="coordinates()"
    [sending]="sending()"
    (eventSubmit)="onEventSubmit($event)"
  />

  <app-pitch
    [coordinates]="coordinates()"
    (coordinatesChange)="onCoordinatesChange($event)"
  />

  @if (statusMessage()) {
    <p class="status">{{ statusMessage() }}</p>
  }
</main>
